name: p33 Hot Update Capture Build

on:
  workflow_dispatch:
  push:
    branches:
      - test/zonoemenu-v1-p33-hotupdate-capture-build
    paths:
      - 'VERSION'
      - 'testmod/Bsphp/main.m'
      - '.github/workflows/p33-hotupdate-capture-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout p33 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore verified p32 Xcode source registrations
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin work/zonoemenu-v1-p32-dispatcher-split
          git show FETCH_HEAD:testmod.xcodeproj/project.pbxproj > testmod.xcodeproj/project.pbxproj
          test "$(grep -c 'ZONFeatureDispatcher.m in Sources' testmod.xcodeproj/project.pbxproj)" -eq 2
          test "$(grep -c 'ZONFeatureRegistry.m in Sources' testmod.xcodeproj/project.pbxproj)" -eq 2
          test "$(grep -c 'ZONFeatureRenderer.m in Sources' testmod.xcodeproj/project.pbxproj)" -eq 2
          test "$(grep -c 'ZONMenuCoordinator.m in Sources' testmod.xcodeproj/project.pbxproj)" -eq 2

      - name: Verify p33 capture source
        run: |
          set -euxo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = 'v1_p33'
          grep -F '#import "../category/wyURLProtocol.h"' testmod/Bsphp/main.m
          grep -F '@implementation wyURLProtocol' testmod/Bsphp/main.m
          grep -F 'ZONInstallHotUpdateCapture();' testmod/Bsphp/main.m
          grep -F 'ZON hot-update capture' testmod/Bsphp/main.m
          grep -F 'BODY_URL' testmod/Bsphp/main.m
          git diff --check

      - name: Resolve artifact name
        run: |
          set -euxo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "TESTMOD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TESTMOD_FILENAME=testmod_${VERSION}_B_debug.dylib" >> "$GITHUB_ENV"

      - name: Select Xcode 16.4
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare dependency cache destinations
        run: |
          set -euxo pipefail
          sudo mkdir -p /opt/MonkeyDev /opt/theos
          sudo chown -R "$USER":staff /opt/MonkeyDev /opt/theos

      - name: Restore legacy build dependency cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/MonkeyDev
            /opt/theos
          key: zonoe-builddeps-${{ runner.os }}-macos15-xcode16.4-${{ hashFiles('ci/dependencies.lock') }}

      - name: Install legacy build dependencies
        run: |
          set -euxo pipefail
          brew install ldid dpkg || true
          source ci/dependencies.lock

          repo_at_sha() {
            local dir="$1" sha="$2" required="$3"
            [[ -d "$dir/.git" ]] || return 1
            [[ "$(git -C "$dir" rev-parse HEAD 2>/dev/null || true)" == "$sha" ]] || return 1
            [[ -e "$dir/$required" ]] || return 1
          }

          theos_at_sha() {
            repo_at_sha /opt/theos "$THEOS_SHA" vendor/include || return 1
            local state
            state="$(git -C /opt/theos submodule status --recursive 2>/dev/null)" || return 1
            ! printf '%s\n' "$state" | grep -Eq '^[+-U]'
          }

          install_pinned_repo() {
            local dir="$1" url="$2" sha="$3"
            sudo rm -rf "$dir"
            sudo mkdir -p "$dir"
            sudo chown "$USER":staff "$dir"
            git -C "$dir" init -q
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch --depth=1 origin "$sha"
            git -C "$dir" checkout --detach FETCH_HEAD
          }

          repo_at_sha /opt/MonkeyDev "$MONKEYDEV_SHA" bin/md || \
            install_pinned_repo /opt/MonkeyDev https://github.com/AloneMonkey/MonkeyDev.git "$MONKEYDEV_SHA"

          if ! theos_at_sha; then
            install_pinned_repo /opt/theos https://github.com/theos/theos.git "$THEOS_SHA"
            git -C /opt/theos submodule sync --recursive
            git -C /opt/theos submodule update --init --recursive
          fi

          test -x /opt/MonkeyDev/bin/md
          test -d /opt/theos/vendor/include

      - name: Materialize pinned vendor sources
        run: |
          set -euxo pipefail
          bash scripts/bootstrap_vendor.sh

      - name: Configure B_debug variant
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('testmod/菜单/PubgLoad.mm')
          s = p.read_text()
          old = 'BOOL testMode = NO; // NO = 正常验证, YES = 测试模式（绕过验证）'
          new = 'BOOL testMode = YES; // B_debug: 云存档测试模式（绕过购买验证）'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one cloud testMode switch, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build B_debug dylib
        id: xcodebuild
        run: |
          set +e
          mkdir -p build/Release-iphoneos
          xcodebuild \
            -project testmod.xcodeproj \
            -target testmod \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            ARCHS='arm64 arm64e' \
            ONLY_ACTIVE_ARCH=NO \
            VALIDATE_PRODUCT=NO \
            MonkeyDevInstallOnAnyBuild=NO \
            MonkeyDevInstallOnProfiling=NO \
            MonkeyDevBuildPackageOnAnyBuild=NO \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) ZON_BUILD_VARIANT_DEBUG=1' \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            build 2>&1 | tee build/xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "XCODEBUILD_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Report first compiler errors
        if: always()
        run: |
          set -euo pipefail
          echo "xcodebuild status: ${XCODEBUILD_STATUS:-unknown}"
          grep -n -m 30 -E '(^|[[:space:]])(fatal )?error:|Undefined symbols for architecture|duplicate symbol|ld: ' build/xcodebuild.log || true

      - name: Package and verify capture dylib
        if: env.XCODEBUILD_STATUS == '0'
        run: |
          set -euxo pipefail
          SOURCE='build/Release-iphoneos/testmod.dylib'
          TARGET="build/Release-iphoneos/${TESTMOD_FILENAME}"
          test -s "$SOURCE"
          cp "$SOURCE" "$TARGET"
          file "$TARGET"
          lipo -info "$TARGET"
          ACTUAL_ARCHS="$(lipo -archs "$TARGET")"
          printf '%s\n' "$ACTUAL_ARCHS" | tr ' ' '\n' | grep -Fx arm64
          printf '%s\n' "$ACTUAL_ARCHS" | tr ' ' '\n' | grep -Fx arm64e
          otool -L "$TARGET"
          strings "$TARGET" | grep -F 'ZON hot-update capture'
          strings "$TARGET" | grep -F 'zonoe.hotupdate.handled'
          shasum -a 256 "$TARGET" | tee build/B_debug.sha256

      - name: Upload p33 capture dylib and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testmod-${{ env.TESTMOD_VERSION }}-B_debug
          path: |
            build/Release-iphoneos/${{ env.TESTMOD_FILENAME }}
            build/B_debug.sha256
            build/xcodebuild.log
          if-no-files-found: warn

      - name: Fail if Xcode build failed
        if: env.XCODEBUILD_STATUS != '0'
        run: exit "${XCODEBUILD_STATUS:-1}"
