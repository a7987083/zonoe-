name: p41 Apply UDID Bridge Boundary

on:
  push:
    branches:
      - work/zonoemenu-v1-p41-udidbridge-boundary
    paths:
      - '.github/workflows/p41-apply-udidbridge-boundary.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/zonoemenu-v1-p41-udidbridge-boundary
          fetch-depth: 0
      - name: Apply guarded P41 source migration
        run: |
          set -euxo pipefail
          python3 scripts/p41_apply_udidbridge_boundary.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          pbx=Path('testmod.xcodeproj/project.pbxproj').read_text(errors='replace')
          names=[]
          for name in re.findall(r'/\* ([^*/\n]+?) in Sources \*/', pbx):
              if name not in names: names.append(name)
          assert len(names)==76, len(names)
          assert names.count('ZONUDIDBridge.m')==1
          assert Path('VERSION').read_text().strip()=='v1_p41'
          PY
      - name: Commit generated P41 product source
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION testmod/ZONServices/ZONUDIDBridge.h testmod/ZONServices/ZONUDIDBridge.m testmod.xcodeproj/project.pbxproj
          git diff --cached --check
          git commit -m 'refactor: move UDID bridge implementation into translation unit'
          git push origin HEAD:work/zonoemenu-v1-p41-udidbridge-boundary
