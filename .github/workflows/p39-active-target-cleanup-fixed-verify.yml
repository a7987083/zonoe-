name: p39 Fixed Runtime Verification

on:
  push:
    branches:
      - test/zonoemenu-v1-p39-active-target-cleanup-build
    paths:
      - '.github/workflows/p39-active-target-cleanup-fixed-verify.yml'

permissions:
  contents: read
  actions: read

env:
  P39_SOURCE_SHA: 613882da7068795533c530d45775f7ae5f79ed56

jobs:
  smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.P39_SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact P39 runtime source
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$P39_SOURCE_SHA"
          test "$(tr -d '[:space:]' < VERSION)" = 'v1_p39'
          python3 Tests/p39_active_target_cleanup_contract.py
          python3 Tests/bootstrap_moduleloader_contract.py
          python3 Tests/dispatcher_contract_smoke.py
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation \
            Tests/feature_registry_smoke.m testmod/ZONCore/ZONFeatureRegistry.m \
            -o /tmp/feature-registry-smoke
          /tmp/feature-registry-smoke
      - name: Compile bootstrap boundaries
        run: |
          set -euxo pipefail
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -c testmod/ZONCore/ZONModuleLoader.m -o /tmp/ZONModuleLoader.o
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -c testmod/ZONBootstrap/ZONBootstrap.m -o /tmp/ZONBootstrap.o
      - name: Run module ABI smoke
        run: |
          set -euxo pipefail
          clang -std=c11 -Wall -Wextra -Werror -I ZONCore Tests/module_abi_smoke.c Examples/ZONExampleModule.c -o /tmp/module-abi-smoke
          /tmp/module-abi-smoke

  build:
    needs: smoke
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: A_customer
            debug_macro: 0
            cloud_testmode: NO
          - variant: B_debug
            debug_macro: 1
            cloud_testmode: YES
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.P39_SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact source
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$P39_SOURCE_SHA"
          python3 Tests/p39_active_target_cleanup_contract.py
      - name: Resolve version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "TESTMOD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TESTMOD_FILENAME=testmod_${VERSION}_${{ matrix.variant }}.dylib" >> "$GITHUB_ENV"
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Prepare dependency cache destinations
        run: |
          sudo mkdir -p /opt/MonkeyDev /opt/theos
          sudo chown -R "$USER":staff /opt/MonkeyDev /opt/theos
      - name: Restore legacy build dependency cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/MonkeyDev
            /opt/theos
          key: zonoe-builddeps-${{ runner.os }}-macos15-xcode16.4-${{ hashFiles('ci/dependencies.lock') }}
      - name: Install legacy build dependencies
        run: |
          set -euxo pipefail
          brew install ldid dpkg || true
          source ci/dependencies.lock
          repo_at_sha() {
            local dir="$1" sha="$2" required="$3"
            [[ -d "$dir/.git" ]] || return 1
            [[ "$(git -C "$dir" rev-parse HEAD 2>/dev/null || true)" == "$sha" ]] || return 1
            [[ -e "$dir/$required" ]] || return 1
          }
          theos_at_sha() {
            repo_at_sha /opt/theos "$THEOS_SHA" vendor/include || return 1
            local state
            state="$(git -C /opt/theos submodule status --recursive 2>/dev/null)" || return 1
            ! printf '%s\n' "$state" | grep -Eq '^[+-U]'
          }
          install_pinned_repo() {
            local dir="$1" url="$2" sha="$3"
            sudo rm -rf "$dir"
            sudo mkdir -p "$dir"
            sudo chown "$USER":staff "$dir"
            git -C "$dir" init -q
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch --depth=1 origin "$sha"
            git -C "$dir" checkout --detach FETCH_HEAD
          }
          repo_at_sha /opt/MonkeyDev "$MONKEYDEV_SHA" bin/md || install_pinned_repo /opt/MonkeyDev https://github.com/AloneMonkey/MonkeyDev.git "$MONKEYDEV_SHA"
          if ! theos_at_sha; then
            install_pinned_repo /opt/theos https://github.com/theos/theos.git "$THEOS_SHA"
            git -C /opt/theos submodule sync --recursive
            git -C /opt/theos submodule update --init --recursive
          fi
      - name: Materialize pinned vendor sources
        run: bash scripts/bootstrap_vendor.sh
      - name: Configure build variant
        run: |
          if [[ "${{ matrix.cloud_testmode }}" == 'YES' ]]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('testmod/菜单/PubgLoad.mm')
          s = p.read_text()
          old = 'BOOL testMode = NO; // NO = 正常验证, YES = 测试模式（绕过验证）'
          new = 'BOOL testMode = YES; // B_debug: 云存档测试模式（绕过购买验证）'
          if s.count(old) != 1: raise SystemExit('cloud testMode marker mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          fi
      - name: Build testmod dylib
        run: |
          set +e
          mkdir -p build/Release-iphoneos
          xcodebuild -project testmod.xcodeproj -target testmod -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY='' IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            ARCHS='arm64 arm64e' ONLY_ACTIVE_ARCH=NO VALIDATE_PRODUCT=NO \
            MonkeyDevInstallOnAnyBuild=NO MonkeyDevInstallOnProfiling=NO MonkeyDevBuildPackageOnAnyBuild=NO \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) ZON_BUILD_VARIANT_DEBUG=${{ matrix.debug_macro }}' \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" build 2>&1 | tee build/xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "XCODEBUILD_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Package and verify dylib
        if: env.XCODEBUILD_STATUS == '0'
        run: |
          set -euxo pipefail
          SOURCE='build/Release-iphoneos/testmod.dylib'
          TARGET="build/Release-iphoneos/${TESTMOD_FILENAME}"
          test -s "$SOURCE"
          cp "$SOURCE" "$TARGET"
          lipo -archs "$TARGET" | tr ' ' '\n' | grep -Fx arm64
          lipo -archs "$TARGET" | tr ' ' '\n' | grep -Fx arm64e
          SHA="$(shasum -a 256 "$TARGET" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "$TARGET" | tee "build/${{ matrix.variant }}.sha256"
      - name: Compare P38/P39 ObjC metadata and exported symbols
        if: env.XCODEBUILD_STATUS == '0' && matrix.variant == 'A_customer'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          CURR="build/Release-iphoneos/${TESTMOD_FILENAME}"
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/a7987083/zonoe-/actions/artifacts/10345384325/zip' \
            -o /tmp/p38.zip
          rm -rf /tmp/p38-artifact && mkdir -p /tmp/p38-artifact
          unzip -q /tmp/p38.zip -d /tmp/p38-artifact
          BASE="$(find /tmp/p38-artifact -type f -name '*.dylib' | head -n 1)"
          test -n "$BASE"
          test "$(shasum -a 256 "$BASE" | awk '{print $1}')" = '560165e890968cd5e229e31193c85d76a75ef2620b19bd71dd554e795a7c11c9'

          strings "$BASE" > /tmp/p38.strings
          strings "$CURR" > /tmp/p39.strings
          for selector in \
            'sizeWithFont:andMaxSize:' \
            'sizeWithString:andFont:andMaxSize:' \
            'sizeOfFontSize:' \
            'sizeOfFontSize:maxWidth:'; do
            if ! grep -Fqx "$selector" /tmp/p38.strings; then
              echo "expected P38 NSString(Tools) selector missing: $selector" >&2
              exit 1
            fi
            if grep -Fqx "$selector" /tmp/p39.strings; then
              echo "retired NSString(Tools) selector still present: $selector" >&2
              exit 1
            fi
          done

          nm -gjU "$BASE" | sort -u > /tmp/p38.exports
          nm -gjU "$CURR" | sort -u > /tmp/p39.exports
          if ! diff -u /tmp/p38.exports /tmp/p39.exports > build/p38-p39-export-diff.txt; then
            cat build/p38-p39-export-diff.txt
            echo 'unexpected exported symbol drift between P38 and P39' >&2
            exit 1
          fi
          printf '%s\n' \
            'P39 metadata check PASS: exported symbol set unchanged; NSString(Tools) unique selectors retired.' \
            | tee build/p39-metadata-check.txt
      - name: Upload dylib and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testmod-${{ env.TESTMOD_VERSION }}-${{ matrix.variant }}-fixed-verify
          path: |
            build/Release-iphoneos/${{ env.TESTMOD_FILENAME }}
            build/${{ matrix.variant }}.sha256
            build/xcodebuild.log
            build/p38-p39-export-diff.txt
            build/p39-metadata-check.txt
          if-no-files-found: warn
      - name: Fail if Xcode build failed
        if: env.XCODEBUILD_STATUS != '0'
        run: exit "${XCODEBUILD_STATUS:-1}"
