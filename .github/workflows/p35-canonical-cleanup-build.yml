name: p35 Canonical Cleanup Build

on:
  push:
    branches:
      - test/zonoemenu-v1-p35-canonical-cleanup-build
    paths:
      - '.github/workflows/p35-canonical-cleanup-build.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout staged p35 work branch
        uses: actions/checkout@v4
        with:
          ref: work/zonoemenu-v1-p35-canonical-cleanup
          fetch-depth: 0

      - name: Apply canonical cleanup
        run: |
          set -euxo pipefail
          test -s scripts/p35_apply_canonical_cleanup.py
          python3 scripts/p35_apply_canonical_cleanup.py
          test "$(tr -d '[:space:]' < VERSION)" = 'v1_p35'
          grep -F '@"base.remote-download"' testmod/ZONCore/ZONFeatureRegistry.m
          grep -F '@"base.cloud-save"' testmod/ZONCore/ZONFeatureRegistry.m
          grep -F '@"base.local-files"' testmod/ZONCore/ZONFeatureRegistry.m
          grep -F '@"data.backup-save"' testmod/ZONCore/ZONFeatureRegistry.m
          grep -F '@"data.restore-save"' testmod/ZONCore/ZONFeatureRegistry.m
          grep -F '@"data.clear-game-data"' testmod/ZONCore/ZONFeatureRegistry.m
          grep -F '@"auth.clear-records"' testmod/ZONCore/ZONFeatureRegistry.m
          grep -F '@"runtime.iap-noads"' testmod/ZONCore/ZONFeatureRegistry.m
          grep -F '@"runtime.ad-speed"' testmod/ZONCore/ZONFeatureRegistry.m
          ! grep -F 'runtime.placeholder-203' testmod/ZONCore/ZONFeatureRegistry.m
          ! grep -F 'runtime.placeholder-203' testmod/ZONCore/ZONFeatureRenderer.m
          ! grep -F 'runtime.placeholder-203' testmod/ZONCore/ZONFeatureDispatcher.m
          ! grep -F '人物血量' testmod/ZONCore/ZONFeatureDispatcher.m
          python3 Tests/bootstrap_moduleloader_contract.py
          python3 Tests/dispatcher_contract_smoke.py
          git diff --check

      - name: Commit integrated p35 source
        run: |
          set -euxo pipefail
          git config user.name 'a7987083'
          git config user.email '85878547+a7987083@users.noreply.github.com'
          git add -A
          git commit -m 'cleanup: canonicalize v1_p35 source tree'
          git push origin HEAD:refs/heads/work/zonoemenu-v1-p35-canonical-cleanup

      - name: Resolve p35 source head
        id: source
        run: |
          set -euxo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "p35 source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat cd9a0ab78158de11f1d51cda7461dbc6dd60f956..HEAD >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: integrate
    runs-on: macos-15
    steps:
      - name: Checkout integrated p35 source
        uses: actions/checkout@v4
        with:
          ref: work/zonoemenu-v1-p35-canonical-cleanup
          fetch-depth: 0

      - name: Verify source and contracts
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.integrate.outputs.source_sha }}"
          test "$(tr -d '[:space:]' < VERSION)" = 'v1_p35'
          python3 Tests/bootstrap_moduleloader_contract.py
          python3 Tests/dispatcher_contract_smoke.py
          clang -fobjc-arc -Wall -Wextra -Werror \
            -framework Foundation \
            Tests/feature_registry_smoke.m testmod/ZONCore/ZONFeatureRegistry.m \
            -o /tmp/zonoemenu-feature-registry-smoke
          /tmp/zonoemenu-feature-registry-smoke
          ! grep -R -F 'runtime.placeholder-203' testmod/ZONCore Tests/feature_registry_smoke.m Tests/dispatcher_contract_smoke.py
          ! grep -R -F '人物血量' testmod/ZONCore

      - name: Compile p33 boundaries independently
        run: |
          set -euxo pipefail
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -c testmod/ZONCore/ZONModuleLoader.m -o /tmp/ZONModuleLoader.o
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -c testmod/ZONBootstrap/ZONBootstrap.m -o /tmp/ZONBootstrap.o
          nm -gU /tmp/ZONModuleLoader.o | grep '_ZONCoreLog$'
          nm -gU /tmp/ZONModuleLoader.o | grep '_ZONGetHostAPI$'
          nm -gU /tmp/ZONModuleLoader.o | grep '_ZONLoadBundledModules$'
          nm -gU /tmp/ZONBootstrap.o | grep '_ZONBootstrapStart$'

      - name: Run module ABI smoke
        run: |
          set -euxo pipefail
          clang -std=c11 -Wall -Wextra -Werror -I ZONCore \
            Tests/module_abi_smoke.c Examples/ZONExampleModule.c \
            -o /tmp/zonoemenu-module-abi-smoke
          /tmp/zonoemenu-module-abi-smoke
          clang -std=c11 -Wall -Wextra -Werror -dynamiclib -I ZONCore \
            Examples/ZONExampleModule.c -o /tmp/ZONExampleModule.dylib
          nm -gU /tmp/ZONExampleModule.dylib | grep '_zonoe_module_abi_version$'
          nm -gU /tmp/ZONExampleModule.dylib | grep '_zonoe_module_identifier$'
          nm -gU /tmp/ZONExampleModule.dylib | grep '_zonoe_module_initialize$'

  build:
    needs: [integrate, smoke]
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: A_customer
            debug_macro: 0
            cloud_testmode: NO
          - variant: B_debug
            debug_macro: 1
            cloud_testmode: YES
    steps:
      - name: Checkout integrated p35 source
        uses: actions/checkout@v4
        with:
          ref: work/zonoemenu-v1-p35-canonical-cleanup
          fetch-depth: 0

      - name: Verify exact source head
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.integrate.outputs.source_sha }}"
          test "$(tr -d '[:space:]' < VERSION)" = 'v1_p35'
          python3 Tests/bootstrap_moduleloader_contract.py
          python3 Tests/dispatcher_contract_smoke.py
          ! grep -F 'runtime.placeholder-203' testmod/ZONCore/ZONFeatureRegistry.m
          ! grep -F 'runtime.placeholder-203' testmod/ZONCore/ZONFeatureRenderer.m
          ! grep -F 'runtime.placeholder-203' testmod/ZONCore/ZONFeatureDispatcher.m

      - name: Resolve testmod version
        run: |
          set -euxo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "TESTMOD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TESTMOD_FILENAME=testmod_${VERSION}_${{ matrix.variant }}.dylib" >> "$GITHUB_ENV"

      - name: Select Xcode 16.4
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare dependency cache destinations
        run: |
          set -euxo pipefail
          sudo mkdir -p /opt/MonkeyDev /opt/theos
          sudo chown -R "$USER":staff /opt/MonkeyDev /opt/theos

      - name: Restore legacy build dependency cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/MonkeyDev
            /opt/theos
          key: zonoe-builddeps-${{ runner.os }}-macos15-xcode16.4-${{ hashFiles('ci/dependencies.lock') }}

      - name: Install legacy build dependencies
        run: |
          set -euxo pipefail
          brew install ldid dpkg || true
          source ci/dependencies.lock
          repo_at_sha() {
            local dir="$1" sha="$2" required="$3"
            [[ -d "$dir/.git" ]] || return 1
            [[ "$(git -C "$dir" rev-parse HEAD 2>/dev/null || true)" == "$sha" ]] || return 1
            [[ -e "$dir/$required" ]] || return 1
          }
          theos_at_sha() {
            repo_at_sha /opt/theos "$THEOS_SHA" vendor/include || return 1
            local state
            state="$(git -C /opt/theos submodule status --recursive 2>/dev/null)" || return 1
            ! printf '%s\n' "$state" | grep -Eq '^[+-U]'
          }
          install_pinned_repo() {
            local dir="$1" url="$2" sha="$3"
            sudo rm -rf "$dir"
            sudo mkdir -p "$dir"
            sudo chown "$USER":staff "$dir"
            git -C "$dir" init -q
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch --depth=1 origin "$sha"
            git -C "$dir" checkout --detach FETCH_HEAD
          }
          repo_at_sha /opt/MonkeyDev "$MONKEYDEV_SHA" bin/md || install_pinned_repo /opt/MonkeyDev https://github.com/AloneMonkey/MonkeyDev.git "$MONKEYDEV_SHA"
          if ! theos_at_sha; then
            install_pinned_repo /opt/theos https://github.com/theos/theos.git "$THEOS_SHA"
            git -C /opt/theos submodule sync --recursive
            git -C /opt/theos submodule update --init --recursive
          fi
          test -x /opt/MonkeyDev/bin/md
          test -d /opt/theos/vendor/include

      - name: Materialize pinned vendor sources
        run: |
          set -euxo pipefail
          bash scripts/bootstrap_vendor.sh

      - name: Configure build variant
        run: |
          set -euxo pipefail
          if [[ "${{ matrix.cloud_testmode }}" == 'YES' ]]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('testmod/菜单/PubgLoad.mm')
          s = p.read_text()
          old = 'BOOL testMode = NO; // NO = 正常验证, YES = 测试模式（绕过验证）'
          new = 'BOOL testMode = YES; // B_debug: 云存档测试模式（绕过购买验证）'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one cloud testMode switch, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          fi

      - name: Build testmod dylib
        run: |
          set +e
          mkdir -p build/Release-iphoneos
          xcodebuild \
            -project testmod.xcodeproj \
            -target testmod \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            ARCHS='arm64 arm64e' \
            ONLY_ACTIVE_ARCH=NO \
            VALIDATE_PRODUCT=NO \
            MonkeyDevInstallOnAnyBuild=NO \
            MonkeyDevInstallOnProfiling=NO \
            MonkeyDevBuildPackageOnAnyBuild=NO \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) ZON_BUILD_VARIANT_DEBUG=${{ matrix.debug_macro }}' \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            build 2>&1 | tee build/xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "XCODEBUILD_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Report first compiler errors
        if: always()
        run: |
          set -euo pipefail
          grep -n -m 30 -E '(^|[[:space:]])(fatal )?error:|Undefined symbols for architecture|duplicate symbol|ld: ' build/xcodebuild.log || true

      - name: Package and verify dylib
        if: env.XCODEBUILD_STATUS == '0'
        run: |
          set -euxo pipefail
          SOURCE='build/Release-iphoneos/testmod.dylib'
          TARGET="build/Release-iphoneos/${TESTMOD_FILENAME}"
          test -s "$SOURCE"
          cp "$SOURCE" "$TARGET"
          file "$TARGET"
          ACTUAL_ARCHS="$(lipo -archs "$TARGET")"
          printf '%s\n' "$ACTUAL_ARCHS" | tr ' ' '\n' | grep -Fx arm64
          printf '%s\n' "$ACTUAL_ARCHS" | tr ' ' '\n' | grep -Fx arm64e
          otool -L "$TARGET"
          shasum -a 256 "$TARGET" | tee "build/${{ matrix.variant }}.sha256"

      - name: Upload dylib and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testmod-${{ env.TESTMOD_VERSION }}-${{ matrix.variant }}
          path: |
            build/Release-iphoneos/${{ env.TESTMOD_FILENAME }}
            build/${{ matrix.variant }}.sha256
            build/xcodebuild.log
          if-no-files-found: warn

      - name: Fail if Xcode build failed
        if: env.XCODEBUILD_STATUS != '0'
        run: exit "${XCODEBUILD_STATUS:-1}"
