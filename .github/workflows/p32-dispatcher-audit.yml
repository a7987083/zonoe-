name: p32 Dispatcher Boundary Audit

on:
  push:
    branches:
      - work/zonoemenu-v1-p32-dispatcher-audit
    paths:
      - 'Tests/dispatcher_boundary_audit.py'
      - 'testmod/ZONCore/**'
      - 'testmod.xcodeproj/project.pbxproj'
      - '.github/workflows/p32-dispatcher-audit.yml'
      - 'ROADMAP.md'
      - 'CHANGELOG_DEV.md'
      - 'HANDOFF.md'
      - 'PROJECT_STATE.json'
      - 'KNOWN_ISSUES.md'
  workflow_dispatch:

jobs:
  audit:
    runs-on: macos-15
    steps:
      - name: Checkout p32 audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove audit phase does not change p31 product source
        run: |
          set -euxo pipefail
          git diff --exit-code 5c0e5afddfecc9e9ed4b89f7ad42780cd652847f -- \
            testmod \
            testmod.xcodeproj/project.pbxproj \
            VERSION

      - name: Run Dispatcher boundary audit
        run: |
          set -euxo pipefail
          python3 Tests/dispatcher_boundary_audit.py

      - name: Verify p31 permanent smokes still pass
        run: |
          set -euxo pipefail
          clang -fobjc-arc -Wall -Wextra -Werror \
            -framework Foundation \
            Tests/feature_registry_smoke.m testmod/ZONCore/ZONFeatureRegistry.m \
            -o /tmp/zonoemenu-feature-registry-smoke
          /tmp/zonoemenu-feature-registry-smoke

          clang -std=c11 -Wall -Wextra -Werror \
            -I ZONCore \
            Tests/module_abi_smoke.c Examples/ZONExampleModule.c \
            -o /tmp/zonoemenu-module-abi-smoke
          /tmp/zonoemenu-module-abi-smoke
