name: p60 UDID Progress Dialog

on:
  push:
    branches:
      - test/zonoemenu-v1-p60-udid-progress-dialog

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact P60 runtime scope
        run: |
          set -euo pipefail
          BASE=3ac88531014241bf63d48c9348ca51937c9ab295
          git -c core.quotePath=false diff --name-only "$BASE" HEAD -- testmod testmod.xcodeproj | tee /tmp/runtime-files
          test "$(wc -l < /tmp/runtime-files | tr -d ' ')" = "1"
          grep -Fx 'testmod/ZONServices/ZONUDIDBridge.m' /tmp/runtime-files
          COUNT=$(grep -o '/\* .* in Sources \*/,' testmod.xcodeproj/project.pbxproj | wc -l | tr -d ' ')
          echo "ACTIVE_SOURCES=$COUNT"
          test "$COUNT" = "78"
      - name: Verify P60 dialog contract
        run: python3 Tests/p60_udid_progress_dialog_contract.py

  build:
    needs: contract
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: A_customer
            debug_macro: 0
            cloud_testmode: NO
            baseline_artifact_id: 10570259619
          - variant: B_debug
            debug_macro: 1
            cloud_testmode: YES
            baseline_artifact_id: 10568884387
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify P60 contract
        run: python3 Tests/p60_udid_progress_dialog_contract.py
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Prepare dependency cache destinations
        run: |
          sudo mkdir -p /opt/MonkeyDev /opt/theos
          sudo chown -R "$USER":staff /opt/MonkeyDev /opt/theos
      - name: Restore legacy build dependency cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/MonkeyDev
            /opt/theos
          key: zonoe-builddeps-${{ runner.os }}-macos15-xcode16.4-${{ hashFiles('ci/dependencies.lock') }}
      - name: Install legacy build dependencies
        run: |
          set -euxo pipefail
          brew install ldid dpkg || true
          source ci/dependencies.lock
          repo_at_sha() {
            local dir="$1" sha="$2" required="$3"
            [[ -d "$dir/.git" ]] || return 1
            [[ "$(git -C "$dir" rev-parse HEAD 2>/dev/null || true)" == "$sha" ]] || return 1
            [[ -e "$dir/$required" ]] || return 1
          }
          theos_at_sha() {
            repo_at_sha /opt/theos "$THEOS_SHA" vendor/include || return 1
            local state
            state="$(git -C /opt/theos submodule status --recursive 2>/dev/null)" || return 1
            ! printf '%s\n' "$state" | grep -Eq '^[+-U]'
          }
          install_pinned_repo() {
            local dir="$1" url="$2" sha="$3"
            sudo rm -rf "$dir"
            sudo mkdir -p "$dir"
            sudo chown "$USER":staff "$dir"
            git -C "$dir" init -q
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch --depth=1 origin "$sha"
            git -C "$dir" checkout --detach FETCH_HEAD
          }
          repo_at_sha /opt/MonkeyDev "$MONKEYDEV_SHA" bin/md || install_pinned_repo /opt/MonkeyDev https://github.com/AloneMonkey/MonkeyDev.git "$MONKEYDEV_SHA"
          if ! theos_at_sha; then
            install_pinned_repo /opt/theos https://github.com/theos/theos.git "$THEOS_SHA"
            git -C /opt/theos submodule sync --recursive
            git -C /opt/theos submodule update --init --recursive
          fi
      - name: Materialize pinned vendor sources
        run: bash scripts/bootstrap_vendor.sh
      - name: Configure build variant
        run: |
          if [[ "${{ matrix.cloud_testmode }}" == 'YES' ]]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('testmod/菜单/PubgLoad.mm')
          s = p.read_text()
          old = 'BOOL testMode = NO; // NO = 正常验证, YES = 测试模式（绕过验证）'
          new = 'BOOL testMode = YES; // B_debug: 云存档测试模式（绕过购买验证）'
          if s.count(old) != 1: raise SystemExit('cloud testMode marker mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          fi
      - name: Build testmod dylib
        run: |
          set -euxo pipefail
          mkdir -p build/Release-iphoneos
          xcodebuild -project testmod.xcodeproj -target testmod -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY='' IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            ARCHS='arm64 arm64e' ONLY_ACTIVE_ARCH=NO VALIDATE_PRODUCT=NO \
            MonkeyDevInstallOnAnyBuild=NO MonkeyDevInstallOnProfiling=NO MonkeyDevBuildPackageOnAnyBuild=NO \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) ZON_BUILD_VARIANT_DEBUG=${{ matrix.debug_macro }}' \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" build 2>&1 | tee build/xcodebuild.log
          cp build/Release-iphoneos/testmod.dylib "build/Release-iphoneos/testmod_v1_p60_${{ matrix.variant }}.dylib"
      - name: Verify architectures ABI and linked libraries
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_ARTIFACT_ID: ${{ matrix.baseline_artifact_id }}
        run: |
          set -euxo pipefail
          CURR="build/Release-iphoneos/testmod_v1_p60_${{ matrix.variant }}.dylib"
          test -s "$CURR"
          lipo -archs "$CURR" | tr ' ' '\n' > build/archs.txt
          grep -Fx arm64 build/archs.txt
          grep -Fx arm64e build/archs.txt
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/a7987083/zonoe-/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip" -o /tmp/p58.zip
          rm -rf /tmp/p58 && mkdir -p /tmp/p58
          unzip -q /tmp/p58.zip -d /tmp/p58
          BASE="$(find /tmp/p58 -type f -name '*.dylib' | head -n 1)"
          test -n "$BASE"
          nm -gjU "$BASE" | sort -u > /tmp/base.exports
          nm -gjU "$CURR" | sort -u > /tmp/curr.exports
          diff -u /tmp/base.exports /tmp/curr.exports
          otool -L "$BASE" | tail -n +2 | sed 's/^[[:space:]]*//' | sort > /tmp/base.loadlibs
          otool -L "$CURR" | tail -n +2 | sed 's/^[[:space:]]*//' | sort > /tmp/curr.loadlibs
          diff -u /tmp/base.loadlibs /tmp/curr.loadlibs
          shasum -a 256 "$CURR" | tee build/${{ matrix.variant }}.sha256
      - name: Upload P60 candidate
        uses: actions/upload-artifact@v4
        with:
          name: p60-udid-progress-dialog-${{ matrix.variant }}
          path: |
            build/Release-iphoneos/testmod_v1_p60_${{ matrix.variant }}.dylib
            build/${{ matrix.variant }}.sha256
            build/archs.txt
            build/xcodebuild.log
          if-no-files-found: error
