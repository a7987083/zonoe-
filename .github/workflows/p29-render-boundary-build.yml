name: p29 Render Boundary Build

on:
  push:
    branches:
      - test/zonoemenu-v1-p29-build-verify
    paths:
      - '.github/workflows/p29-render-boundary-build.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - name: Checkout p29 work branch
        uses: actions/checkout@v4
        with:
          ref: work/zonoemenu-v1-p29-render-boundary
          fetch-depth: 0

      - name: Register p29 render sources in Xcode target
        run: |
          set -euxo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = 'v1_p29'
          python3 - <<'PY'
          from pathlib import Path
          pbx = Path('testmod.xcodeproj/project.pbxproj')
          text = pbx.read_text()
          build_anchor = '\t\t7ECBD42B2F3A614000C56F1C /* ZONMenuCoordinator.m in Sources */ = {isa = PBXBuildFile; fileRef = 7ECBD42A2F3A614000C56F1C /* ZONMenuCoordinator.m */; };\n'
          ref_anchor = '\t\t7ECBD42A2F3A614000C56F1C /* ZONMenuCoordinator.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = "testmod/ZONCore/ZONMenuCoordinator.m"; sourceTree = SOURCE_ROOT; };\n'
          source_anchor = '\t\t\t\t7ECBD42B2F3A614000C56F1C /* ZONMenuCoordinator.m in Sources */,\n'
          build_entries = (
              '\t\t7ECBD42D2F3A614100C56F1C /* ZONMenuPanelController.m in Sources */ = {isa = PBXBuildFile; fileRef = 7ECBD42C2F3A614100C56F1C /* ZONMenuPanelController.m */; };\n'
              '\t\t7ECBD42F2F3A614200C56F1C /* ZONMenuChromeRenderer.m in Sources */ = {isa = PBXBuildFile; fileRef = 7ECBD42E2F3A614200C56F1C /* ZONMenuChromeRenderer.m */; };\n'
              '\t\t7ECBD4312F3A614300C56F1C /* ZONFeatureRenderer.m in Sources */ = {isa = PBXBuildFile; fileRef = 7ECBD4302F3A614300C56F1C /* ZONFeatureRenderer.m */; };\n'
              '\t\t7ECBD4332F3A614400C56F1C /* ZONSectionRenderer.m in Sources */ = {isa = PBXBuildFile; fileRef = 7ECBD4322F3A614400C56F1C /* ZONSectionRenderer.m */; };\n'
          )
          ref_entries = (
              '\t\t7ECBD42C2F3A614100C56F1C /* ZONMenuPanelController.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = "testmod/ZONCore/ZONMenuPanelController.m"; sourceTree = SOURCE_ROOT; };\n'
              '\t\t7ECBD42E2F3A614200C56F1C /* ZONMenuChromeRenderer.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = "testmod/ZONCore/ZONMenuChromeRenderer.m"; sourceTree = SOURCE_ROOT; };\n'
              '\t\t7ECBD4302F3A614300C56F1C /* ZONFeatureRenderer.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = "testmod/ZONCore/ZONFeatureRenderer.m"; sourceTree = SOURCE_ROOT; };\n'
              '\t\t7ECBD4322F3A614400C56F1C /* ZONSectionRenderer.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = "testmod/ZONCore/ZONSectionRenderer.m"; sourceTree = SOURCE_ROOT; };\n'
          )
          source_entries = (
              '\t\t\t\t7ECBD42D2F3A614100C56F1C /* ZONMenuPanelController.m in Sources */,\n'
              '\t\t\t\t7ECBD42F2F3A614200C56F1C /* ZONMenuChromeRenderer.m in Sources */,\n'
              '\t\t\t\t7ECBD4312F3A614300C56F1C /* ZONFeatureRenderer.m in Sources */,\n'
              '\t\t\t\t7ECBD4332F3A614400C56F1C /* ZONSectionRenderer.m in Sources */,\n'
          )
          for label, anchor in [('build', build_anchor), ('ref', ref_anchor), ('source', source_anchor)]:
              if text.count(anchor) != 1:
                  raise SystemExit(f'{label} anchor count={text.count(anchor)}')
          ids = ['7ECBD42C2F3A614100C56F1C','7ECBD42D2F3A614100C56F1C','7ECBD42E2F3A614200C56F1C','7ECBD42F2F3A614200C56F1C','7ECBD4302F3A614300C56F1C','7ECBD4312F3A614300C56F1C','7ECBD4322F3A614400C56F1C','7ECBD4332F3A614400C56F1C']
          for value in ids:
              if value in text:
                  raise SystemExit(f'PBX ID already present: {value}')
          text = text.replace(build_anchor, build_anchor + build_entries, 1)
          text = text.replace(ref_anchor, ref_anchor + ref_entries, 1)
          text = text.replace(source_anchor, source_anchor + source_entries, 1)
          pbx.write_text(text)
          final = pbx.read_text()
          for name in ['ZONMenuPanelController','ZONMenuChromeRenderer','ZONFeatureRenderer','ZONSectionRenderer']:
              if final.count(f'{name}.m in Sources') != 2:
                  raise SystemExit(f'{name}: expected 2 Sources mentions')
          PY
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = '1'
          test "$(git diff --name-only)" = 'testmod.xcodeproj/project.pbxproj'
          git diff -- testmod.xcodeproj/project.pbxproj

      - name: Commit p29 PBX integration
        id: commit
        run: |
          set -euxo pipefail
          git config user.name 'a7987083'
          git config user.email '85878547+a7987083@users.noreply.github.com'
          git add testmod.xcodeproj/project.pbxproj
          git commit -m 'build: register v1_p29 render sources'
          SOURCE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/work/zonoemenu-v1-p29-render-boundary
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "p29 source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: integrate
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: A_customer
            debug_macro: 0
            cloud_testmode: NO
          - variant: B_debug
            debug_macro: 1
            cloud_testmode: YES
    steps:
      - name: Checkout p29 source
        uses: actions/checkout@v4
        with:
          ref: work/zonoemenu-v1-p29-render-boundary

      - name: Verify source commit
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.integrate.outputs.source_sha }}"
          test "$(tr -d '[:space:]' < VERSION)" = 'v1_p29'
          for h in ZONMenuPanelController ZONMenuChromeRenderer ZONFeatureRenderer ZONSectionRenderer; do
            ! grep -F 'static inline' "testmod/ZONCore/${h}.h"
            test -s "testmod/ZONCore/${h}.m"
            test "$(grep -c "${h}.m in Sources" testmod.xcodeproj/project.pbxproj)" -eq 2
          done

      - name: Resolve testmod version
        run: |
          set -euxo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "TESTMOD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TESTMOD_FILENAME=testmod_${VERSION}_${{ matrix.variant }}.dylib" >> "$GITHUB_ENV"

      - name: Select Xcode 16.4
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare dependency cache destinations
        run: |
          set -euxo pipefail
          sudo mkdir -p /opt/MonkeyDev /opt/theos
          sudo chown -R "$USER":staff /opt/MonkeyDev /opt/theos

      - name: Restore legacy build dependency cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/MonkeyDev
            /opt/theos
          key: zonoe-builddeps-${{ runner.os }}-macos15-xcode16.4-${{ hashFiles('ci/dependencies.lock') }}

      - name: Install legacy build dependencies
        run: |
          set -euxo pipefail
          brew install ldid dpkg || true
          source ci/dependencies.lock
          repo_at_sha() {
            local dir="$1" sha="$2" required="$3"
            [[ -d "$dir/.git" ]] || return 1
            [[ "$(git -C "$dir" rev-parse HEAD 2>/dev/null || true)" == "$sha" ]] || return 1
            [[ -e "$dir/$required" ]] || return 1
          }
          theos_at_sha() {
            repo_at_sha /opt/theos "$THEOS_SHA" vendor/include || return 1
            local state
            state="$(git -C /opt/theos submodule status --recursive 2>/dev/null)" || return 1
            ! printf '%s\n' "$state" | grep -Eq '^[+-U]'
          }
          install_pinned_repo() {
            local dir="$1" url="$2" sha="$3"
            sudo rm -rf "$dir"
            sudo mkdir -p "$dir"
            sudo chown "$USER":staff "$dir"
            git -C "$dir" init -q
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch --depth=1 origin "$sha"
            git -C "$dir" checkout --detach FETCH_HEAD
          }
          repo_at_sha /opt/MonkeyDev "$MONKEYDEV_SHA" bin/md || install_pinned_repo /opt/MonkeyDev https://github.com/AloneMonkey/MonkeyDev.git "$MONKEYDEV_SHA"
          if ! theos_at_sha; then
            install_pinned_repo /opt/theos https://github.com/theos/theos.git "$THEOS_SHA"
            git -C /opt/theos submodule sync --recursive
            git -C /opt/theos submodule update --init --recursive
          fi
          test -x /opt/MonkeyDev/bin/md
          test -d /opt/theos/vendor/include

      - name: Materialize pinned vendor sources
        run: |
          set -euxo pipefail
          bash scripts/bootstrap_vendor.sh

      - name: Configure build variant
        run: |
          set -euxo pipefail
          if [[ "${{ matrix.cloud_testmode }}" == 'YES' ]]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('testmod/菜单/PubgLoad.mm')
          s = p.read_text()
          old = 'BOOL testMode = NO; // NO = 正常验证, YES = 测试模式（绕过验证）'
          new = 'BOOL testMode = YES; // B_debug: 云存档测试模式（绕过购买验证）'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one cloud testMode switch, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          fi

      - name: Build testmod dylib
        id: xcodebuild
        run: |
          set +e
          mkdir -p build/Release-iphoneos
          xcodebuild \
            -project testmod.xcodeproj \
            -target testmod \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            ARCHS='arm64 arm64e' \
            ONLY_ACTIVE_ARCH=NO \
            VALIDATE_PRODUCT=NO \
            MonkeyDevInstallOnAnyBuild=NO \
            MonkeyDevInstallOnProfiling=NO \
            MonkeyDevBuildPackageOnAnyBuild=NO \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) ZON_BUILD_VARIANT_DEBUG=${{ matrix.debug_macro }}' \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            build 2>&1 | tee build/xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "XCODEBUILD_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Report first compiler errors
        if: always()
        run: |
          set -euo pipefail
          grep -n -m 20 -E '(^|[[:space:]])(fatal )?error:|Undefined symbols for architecture|duplicate symbol|ld: ' build/xcodebuild.log || true

      - name: Package and verify dylib
        if: env.XCODEBUILD_STATUS == '0'
        run: |
          set -euxo pipefail
          SOURCE='build/Release-iphoneos/testmod.dylib'
          TARGET="build/Release-iphoneos/${TESTMOD_FILENAME}"
          test -s "$SOURCE"
          cp "$SOURCE" "$TARGET"
          file "$TARGET"
          lipo -info "$TARGET"
          otool -L "$TARGET"
          shasum -a 256 "$TARGET" | tee "build/${{ matrix.variant }}.sha256"

      - name: Upload dylib and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testmod-${{ env.TESTMOD_VERSION }}-${{ matrix.variant }}
          path: |
            build/Release-iphoneos/${{ env.TESTMOD_FILENAME }}
            build/xcodebuild.log
            build/${{ matrix.variant }}.sha256
          if-no-files-found: warn

      - name: Propagate xcodebuild failure
        if: env.XCODEBUILD_STATUS != '0'
        run: exit "${XCODEBUILD_STATUS:-1}"
