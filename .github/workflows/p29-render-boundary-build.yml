name: p29 Render Boundary Build

on:
  push:
    branches:
      - test/zonoemenu-v1-p29-build-verify
    paths:
      - '.github/workflows/p29-render-boundary-build.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - name: Checkout p29 work branch
        uses: actions/checkout@v4
        with:
          ref: work/zonoemenu-v1-p29-render-boundary
          fetch-depth: 0

      - name: Split render helpers into translation units
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          version = Path('VERSION')
          if version.read_text() != 'v1_p28\n':
              raise SystemExit(f'unexpected VERSION: {version.read_text()!r}')
          version.write_text('v1_p29\n')

          headers = {
