name: p51d Apply Refactor

on:
  push:
    branches:
      - work/zonoemenu-v1-p51d-pubgload-refactor
    paths:
      - scripts/p51d_refactor_pubgload.py
      - .github/workflows/p51d-apply-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic refactor
        run: python3 scripts/p51d_refactor_pubgload.py
      - name: Verify exact source delta and commit
        run: |
          set -euo pipefail
          git diff --check
          git diff -- testmod/菜单/PubgLoad.mm
          test -n "$(git status --short -- testmod/菜单/PubgLoad.mm)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testmod/菜单/PubgLoad.mm
          git commit -m 'p51d: centralize archive download and entitlement helpers'
          git push origin HEAD:work/zonoemenu-v1-p51d-pubgload-refactor
