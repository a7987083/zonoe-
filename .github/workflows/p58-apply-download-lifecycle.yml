name: p58 Apply Download Lifecycle Reliability

on:
  push:
    branches:
      - work/zonoemenu-v1-p58-download-lifecycle
    paths:
      - '.github/workflows/p58-apply-download-lifecycle.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/zonoemenu-v1-p58-download-lifecycle
          fetch-depth: 0
      - name: Apply guarded P58 transform
        run: |
          set -euxo pipefail
          python3 scripts/p58_apply_download_lifecycle.py
          test "$(tr -d '[:space:]' < VERSION)" = 'v1_p58'
          git diff --check
      - name: Commit generated P58 runtime source
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION testmod/菜单/PubgLoad.mm
          git diff --cached --check
          git commit -m 'p58: harden archive download lifecycle'
          git push origin HEAD:work/zonoemenu-v1-p58-download-lifecycle
