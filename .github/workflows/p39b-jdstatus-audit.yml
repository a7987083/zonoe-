name: p39b JDStatusBarNotification Audit

on:
  push:
    branches:
      - test/zonoemenu-v1-p39b-jdstatus-audit
    paths:
      - '.github/workflows/p39b-jdstatus-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/zonoemenu-v1-p39b-jdstatus-audit
          fetch-depth: 0
      - name: Verify promoted P39 baseline ancestry
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor 613882da7068795533c530d45775f7ae5f79ed56 HEAD
          test "$(tr -d '[:space:]' < VERSION)" = 'v1_p39'
          python3 Tests/p39_active_target_cleanup_contract.py
      - name: Run JDStatus group audit
        run: |
          set -euxo pipefail
          mkdir -p build
          python3 scripts/p39b_jdstatus_audit.py | tee build/p39b-jdstatus-audit.stdout.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('build/p39b-jdstatus-audit.json').read_text())
          assert d['objective_c_source_count']==8, d
          assert all(v==1 for v in d['pbx_source_hits'].values()), d['pbx_source_hits']
          assert all(v==0 for v in d['swift_pbx_hits'].values()), d['swift_pbx_hits']
          assert d['decision']=='KEEP_LIVE_DEPENDENCY', d['decision']
          assert d['strong_removal_candidate'] is False
          assert 'testmod/菜单/PubgLoad.mm' in d['live_ref_files']
          assert 'testmod/Bsphp/main.m' in d['live_ref_files']
          assert 'testmod/Bsphp/WX_NongShiFu123.mm' in d['live_ref_files']
          print('decision:', d['decision'])
          print('live reference files:', d['live_ref_files'])
          print('stale import candidates:', d['stale_import_candidates'])
          print('external dynamic refs:', d['external_dynamic_refs'])
          print('internal auto/runtime entries:', d['internal_auto_runtime_entries'])
          PY
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: p39b-jdstatus-audit
          path: |
            build/p39b-jdstatus-audit.json
            build/p39b-jdstatus-audit.md
            build/p39b-jdstatus-audit.stdout.txt
          if-no-files-found: error
