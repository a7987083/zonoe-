name: P79.8j Auth Cleanup Once

on:
  push:
    branches:
      - work/p79.8-udid-first-rebuild
    paths:
      - '.github/workflows/p79-auth-cleanup-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/p79.8-udid-first-rebuild
          fetch-depth: 0

      - name: Apply auth residue cleanup
        run: |
          set -euxo pipefail
          python3 tools/p79_8j_cleanup_auth_residue.py
          git diff --check

      - name: Verify deleted auth residue and references
        run: |
          set -euxo pipefail
          test ! -e testmod/ZONAuthV2/ZONAuthV2BindingProbe.h
          test ! -e testmod/ZONAuthV2/ZONAuthV2BindingProbe.m
          test ! -e testmod/Bsphp/WX_NongShiFu123.h
          test ! -e testmod/Bsphp/WX_NongShiFu123.mm
          ! grep -R -n 'postVerifyBody\|verifyURLForRuntimeConfig\|ZONAuthV2BindingProbe' testmod/ZONAuthV2 testmod/ZONServices || true
          ! grep -R -n 'ZON_VERIFY_SECRET\|CCHmac(' testmod/ZONAuthV2
          grep -R -n 'auth_proof' testmod/ZONAuthV2/ZONAuthV2API.m testmod/ZONAuthV2/ZONAuthV2Verify.m

      - name: Run auth and architecture contracts
        run: |
          set -euxo pipefail
          python3 Tests/dispatcher_contract_smoke.py
          python3 Tests/p79_8d_passive_satella_contract.py
          python3 Tests/p79_8f_p0_safety_contract.py
          python3 Tests/p79_8g_runtime_capability_boundary.py
          python3 Tests/p79_8h_feature_access_provider.py
          python3 Tests/p79_8i_secretless_auth_v3_contract.py

      - name: Commit cleaned source
        id: commit
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=0' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'refactor(p79.8j): remove obsolete auth verification residue'
            git push origin HEAD:work/p79.8-udid-first-rebuild
            echo 'changed=1' >> "$GITHUB_OUTPUT"
          fi

      - name: Package cleaned Objective-C source
        run: |
          set -euxo pipefail
          git archive --format=zip --output=/tmp/zonoe-v1_p79_8j-oc-source.zip HEAD \
            VERSION testmod testmod.xcodeproj ZONCore Tests ci scripts tools \
            BUILD.md ARCHITECTURE.md ROADMAP.md CHANGELOG_DEV.md HANDOFF.md PROJECT_STATE.json KNOWN_ISSUES.md
          sha256sum /tmp/zonoe-v1_p79_8j-oc-source.zip | tee /tmp/zonoe-v1_p79_8j-oc-source.sha256

      - name: Upload cleaned source
        uses: actions/upload-artifact@v4
        with:
          name: zonoe-v1_p79_8j-oc-source
          path: |
            /tmp/zonoe-v1_p79_8j-oc-source.zip
            /tmp/zonoe-v1_p79_8j-oc-source.sha256
          if-no-files-found: error
