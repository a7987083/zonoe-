name: p60 Apply UDID Progress Dialog

on:
  push:
    branches:
      - work/zonoemenu-v1-p60-udid-progress-dialog
    paths:
      - .github/workflows/p60-apply-udid-progress-dialog.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded P60 transform
        run: python Tools/p60_apply.py
      - name: Verify generated behavior
        run: |
          set -euxo pipefail
          grep -q '获取UDID中' testmod/ZONServices/ZONUDIDBridge.m
          grep -q '重新获取' testmod/ZONServices/ZONUDIDBridge.m
          grep -q 'presentViewController:alert animated:YES completion:launchHandler' testmod/ZONServices/ZONUDIDBridge.m
          grep -q 'ZONUDIDBridgeDismissProgressAlert(unavailableHandler)' testmod/ZONServices/ZONUDIDBridge.m
          ! grep -q 'ZONUDIDBridgeOpenRetryDelay' testmod/ZONServices/ZONUDIDBridge.m
          test "$(cat VERSION)" = 'v1_p60'
      - name: Commit generated P60 runtime source
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testmod/ZONServices/ZONUDIDBridge.m VERSION
          git commit -m 'p60: add interactive UDID acquisition dialog'
          git push
