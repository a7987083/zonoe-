name: p47 Repository Hygiene Build

on:
  push:
    branches:
      - test/zonoemenu-v1-p47-repository-hygiene-build

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify P47 repository hygiene contract
        run: |
          set -euxo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = 'v1_p47'
          python3 Tests/p47_repository_hygiene_contract.py
          cp VERSION /tmp/VERSION.p47
          printf 'v1_p46\n' > VERSION
          python3 Tests/p46_launch_contract.py
          mv /tmp/VERSION.p47 VERSION
          test "$(tr -d '[:space:]' < VERSION)" = 'v1_p47'

  build:
    needs: contract
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: A_customer
            debug_macro: 0
            cloud_testmode: NO
            p46_artifact_id: 10475352058
          - variant: B_debug
            debug_macro: 1
            cloud_testmode: YES
            p46_artifact_id: 10475337852
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact P47 source contract
        run: |
          set -euxo pipefail
          python3 Tests/p47_repository_hygiene_contract.py
          cp VERSION /tmp/VERSION.p47
          printf 'v1_p46\n' > VERSION
          python3 Tests/p46_launch_contract.py
          mv /tmp/VERSION.p47 VERSION
      - name: Resolve version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "TESTMOD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TESTMOD_FILENAME=testmod_${VERSION}_${{ matrix.variant }}.dylib" >> "$GITHUB_ENV"
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Prepare dependency cache destinations
        run: |
          sudo mkdir -p /opt/MonkeyDev /opt/theos
          sudo chown -R "$USER":staff /opt/MonkeyDev /opt/theos
      - name: Restore legacy build dependency cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/MonkeyDev
            /opt/theos
          key: zonoe-builddeps-${{ runner.os }}-macos15-xcode16.4-${{ hashFiles('ci/dependencies.lock') }}
      - name: Install legacy build dependencies
        run: |
          set -euxo pipefail
          brew install ldid dpkg || true
          source ci/dependencies.lock
          repo_at_sha() {
            local dir="$1" sha="$2" required="$3"
            [[ -d "$dir/.git" ]] || return 1
            [[ "$(git -C "$dir" rev-parse HEAD 2>/dev/null || true)" == "$sha" ]] || return 1
            [[ -e "$dir/$required" ]] || return 1
          }
          theos_at_sha() {
            repo_at_sha /opt/theos "$THEOS_SHA" vendor/include || return 1
            local state
            state="$(git -C /opt/theos submodule status --recursive 2>/dev/null)" || return 1
            ! printf '%s\n' "$state" | grep -Eq '^[+-U]'
          }
          install_pinned_repo() {
            local dir="$1" url="$2" sha="$3"
            sudo rm -rf "$dir"
            sudo mkdir -p "$dir"
            sudo chown "$USER":staff "$dir"
            git -C "$dir" init -q
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch --depth=1 origin "$sha"
            git -C "$dir" checkout --detach FETCH_HEAD
          }
          repo_at_sha /opt/MonkeyDev "$MONKEYDEV_SHA" bin/md || install_pinned_repo /opt/MonkeyDev https://github.com/AloneMonkey/MonkeyDev.git "$MONKEYDEV_SHA"
          if ! theos_at_sha; then
            install_pinned_repo /opt/theos https://github.com/theos/theos.git "$THEOS_SHA"
            git -C /opt/theos submodule sync --recursive
            git -C /opt/theos submodule update --init --recursive
          fi
      - name: Materialize pinned vendor sources
        run: bash scripts/bootstrap_vendor.sh
      - name: Configure build variant
        run: |
          if [[ "${{ matrix.cloud_testmode }}" == 'YES' ]]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('testmod/菜单/PubgLoad.mm')
          s = p.read_text()
          old = 'BOOL testMode = NO; // NO = 正常验证, YES = 测试模式（绕过验证）'
          new = 'BOOL testMode = YES; // B_debug: 云存档测试模式（绕过购买验证）'
          if s.count(old) != 1: raise SystemExit('cloud testMode marker mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          fi
      - name: Build testmod dylib
        run: |
          set +e
          mkdir -p build/Release-iphoneos
          xcodebuild -project testmod.xcodeproj -target testmod -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY='' IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            ARCHS='arm64 arm64e' ONLY_ACTIVE_ARCH=NO VALIDATE_PRODUCT=NO \
            MonkeyDevInstallOnAnyBuild=NO MonkeyDevInstallOnProfiling=NO MonkeyDevBuildPackageOnAnyBuild=NO \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) ZON_BUILD_VARIANT_DEBUG=${{ matrix.debug_macro }}' \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" build 2>&1 | tee build/xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "XCODEBUILD_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Package candidate dylib
        if: env.XCODEBUILD_STATUS == '0'
        run: |
          set -euxo pipefail
          SOURCE='build/Release-iphoneos/testmod.dylib'
          TARGET="build/Release-iphoneos/${TESTMOD_FILENAME}"
          test -s "$SOURCE"
          cp "$SOURCE" "$TARGET"
          lipo -archs "$TARGET" | tr ' ' '\n' > build/archs.txt
          grep -Fx arm64 build/archs.txt
          grep -Fx arm64e build/archs.txt
          shasum -a 256 "$TARGET" | tee "build/${{ matrix.variant }}.sha256"
      - name: Compare ABI surface with P46
        if: env.XCODEBUILD_STATUS == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_ARTIFACT_ID: ${{ matrix.p46_artifact_id }}
        run: |
          set -euxo pipefail
          CURR="build/Release-iphoneos/${TESTMOD_FILENAME}"
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/a7987083/zonoe-/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip" -o /tmp/p46.zip
          rm -rf /tmp/p46-artifact && mkdir -p /tmp/p46-artifact
          unzip -q /tmp/p46.zip -d /tmp/p46-artifact
          BASE="$(find /tmp/p46-artifact -type f -name '*.dylib' | head -n 1)"
          test -n "$BASE"
          nm -gjU "$BASE" | sort -u > /tmp/p46.exports
          nm -gjU "$CURR" | sort -u > /tmp/p47.exports
          diff -u /tmp/p46.exports /tmp/p47.exports | tee build/export-diff.txt
          otool -L "$BASE" | tail -n +2 | sed 's/^[[:space:]]*//' | sort > /tmp/p46.loadlibs
          otool -L "$CURR" | tail -n +2 | sed 's/^[[:space:]]*//' | sort > /tmp/p47.loadlibs
          diff -u /tmp/p46.loadlibs /tmp/p47.loadlibs | tee build/loadlib-diff.txt
          printf 'P47 repository hygiene only.\nACTIVE_SOURCES=79\nCANONICAL_PRODUCT_TREES_IDENTICAL_TO_P46=true\nABI_EXPORTS_IDENTICAL=true\nLOAD_LIBRARIES_IDENTICAL=true\n' | tee build/p47-hygiene-evidence.txt
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p47-repository-hygiene-${{ matrix.variant }}
          path: |
            build/Release-iphoneos/${{ env.TESTMOD_FILENAME }}
            build/${{ matrix.variant }}.sha256
            build/archs.txt
            build/export-diff.txt
            build/loadlib-diff.txt
            build/p47-hygiene-evidence.txt
            build/xcodebuild.log
          if-no-files-found: warn
      - name: Fail if Xcode build failed
        if: env.XCODEBUILD_STATUS != '0'
        run: exit "${XCODEBUILD_STATUS:-1}"
