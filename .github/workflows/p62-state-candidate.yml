name: p62 Record Candidate State

on:
  push:
    branches:
      - work/zonoemenu-v1-p62-unified-auth-network-retry
    paths:
      - .github/workflows/p62-state-candidate.yml

permissions:
  contents: write

jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record P62 candidate state
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('PROJECT_STATE.json')
          d = json.loads(p.read_text())
          d['current_work_branch'] = 'work/zonoemenu-v1-p62-unified-auth-network-retry'
          d['current_test_branch'] = 'test/zonoemenu-v1-p62-unified-auth-network-retry'
          d['current_version'] = 'v1_p62'
          d['current_phase'] = 'v1_p62_unified_auth_network_retry'
          d['phase_status'] = 'ci_passed_awaiting_device'
          d['last_ci_run_id'] = 35410564486
          d['last_ci_status'] = 'success'
          if 'p61' in d:
              d['p61']['device_status'] = 'failed_not_promoted'
              d['p61']['device_observation'] = 'User observed only one network-failure notice and no visible recheck window. Root cause: actual authorization HTTP failure paths still used SVProgressHUD/silent return, while only reachability failure had the recheck UIAlert. P61 was not promoted.'
          d['p62'] = {
              'branch': 'work/zonoemenu-v1-p62-unified-auth-network-retry',
              'test_branch': 'test/zonoemenu-v1-p62-unified-auth-network-retry',
              'source_commit': 'a11160e70ff1163b2c462bb3ef5d539da1f489eb',
              'ci_head': 'c1f1415d3787b879def387d68e2df089776dbffa',
              'ci_run_id': 35410564486,
              'ci_status': 'success',
              'device_status': 'pending',
              'active_source_count': 78,
              'a_customer_artifact_id': 10574157091,
              'a_customer_artifact_digest': 'sha256:4f2195f10f1bdfd242aa4ccb3effe89983e69f01384db60e1d57443cb34a291e',
              'a_customer_dylib_sha256': 'b18595538245447109468e323c336c2b36a61795ec18cc19745182ab7784b443',
              'b_debug_artifact_id': 10574166849,
              'b_debug_artifact_digest': 'sha256:3944c761966ca87d78fea2e2d05c5270c27d80be4debfa805063d0694c1cf7a2',
              'behavior_change': 'Authorization network failures are unified into one UIAlert with a visible 重新检查 action. Reachability failures, getBSphpSeSsL/getXinxi HTTP failures, and BSPHPy entitlement fetch failures retry the same authorization mode without re-entering loada.'
          }
          d['next_task'] = 'Real-device validate P62: offline or authorization HTTP failure must show 警告/网络连接失败 with visible 重新检查; tapping it retries the same BSPHP/BSPHPy mode, and restoring connectivity continues authorization. P60 remains rollback baseline until explicit PASS.'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
      - name: Commit candidate state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATE.json
          git commit -m 'state: record P62 candidate after P61 device issue'
          git push
