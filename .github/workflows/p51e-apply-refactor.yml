name: p51e Apply Refactor
on:
  push:
    branches:
      - work/zonoemenu-v1-p51e-destructive-toggle-refactor
    paths:
      - scripts/p51e_refactor_dispatcher.py
      - .github/workflows/p51e-apply-refactor.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic refactor
        run: python3 scripts/p51e_refactor_dispatcher.py
      - name: Verify exact source delta and commit
        run: |
          git -c core.quotePath=false diff --name-only
          test "$(git -c core.quotePath=false diff --name-only)" = "testmod/ZONCore/ZONFeatureDispatcher.m"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testmod/ZONCore/ZONFeatureDispatcher.m
          git commit -m "p51e: centralize destructive confirmations and toggle side effects"
          git push
