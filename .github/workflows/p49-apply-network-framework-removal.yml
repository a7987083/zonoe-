name: p49 Apply Network Framework Removal

on:
  push:
    branches:
      - work/zonoemenu-v1-p49-active-target-audit

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply removal if needed
        run: |
          set -euo pipefail
          COUNT=$(grep -c 'Network.framework' testmod.xcodeproj/project.pbxproj || true)
          echo "NETWORK_PBX_REFERENCE_COUNT=$COUNT"
          if [ "$COUNT" = "0" ]; then
            echo "Network.framework already removed"
            exit 0
          fi
          test "$COUNT" = "7"
          python3 scripts/p49_remove_network_framework.py
          test "$(grep -c 'Network.framework' testmod.xcodeproj/project.pbxproj || true)" = "0"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testmod.xcodeproj/project.pbxproj
          git commit -m 'p49: remove unused Network.framework'
          git push origin HEAD:work/zonoemenu-v1-p49-active-target-audit
