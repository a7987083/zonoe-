name: p39 Active Target Audit

on:
  push:
    branches:
      - test/zonoemenu-v1-p39-active-target-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout p39 audit branch
        uses: actions/checkout@v4
        with:
          ref: work/zonoemenu-v1-p39-active-target-audit
          fetch-depth: 0
      - name: Run active target audit
        run: |
          set -euxo pipefail
          python3 scripts/p39_active_target_audit.py
          python3 scripts/p39_candidate_semantic_check.py
          git diff --check
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: p39-active-target-audit
          path: |
            p39-active-target-audit.md
            p39-active-target-audit.json
            p39-candidate-semantic-check.md
            p39-candidate-semantic-check.json
