name: p34 Cleanup Integration

on:
  push:
    branches:
      - test/zonoemenu-v1-p34-cleanup-build
    paths:
      - '.github/workflows/p34-cleanup-build.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout p34 cleanup branch
        uses: actions/checkout@v4
        with:
          ref: work/zonoemenu-v1-p34-cleanup
          fetch-depth: 0

      - name: Verify cleanup script baseline
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = '345d7743d36dff7133e7507ef71a4e5d715736a4'
          test -s scripts/p34_apply_cleanup.py

      - name: Apply audited cleanup
        run: |
          set -euxo pipefail
          python3 scripts/p34_apply_cleanup.py
          test "$(tr -d '[:space:]' < VERSION)" = 'v1_p34'
          test -s testmod/ZONCore/ZONFeatureRegistry.m
          test -s testmod/ZONCore/ZONFeatureDispatcher.m
          test -s testmod/工具箱/Hook/JiangHuHook.m
          test -s testmod/工具箱/变速器/HookClass.m
          test -s testmod/工具箱/变速器/ImgTool.m
          test ! -e testmod/工具箱/jianghu.mm
          test ! -e testmod/views/DLGMem.m
          test ! -e testmod/菜单/TDAlternateIconCell.m
          python3 Tests/bootstrap_moduleloader_contract.py
          python3 Tests/dispatcher_contract_smoke.py
          git diff --check

      - name: Commit and push cleanup
        run: |
          set -euxo pipefail
          git config user.name 'a7987083'
          git config user.email '85878547+a7987083@users.noreply.github.com'
          git add -A
          git commit -m 'cleanup: remove retired v1_p34 feature stacks'
          git push origin HEAD:refs/heads/work/zonoemenu-v1-p34-cleanup
          echo "p34 cleanup source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat 0f12e4353e8859c585fe2975812964a28b7410d1..HEAD >> "$GITHUB_STEP_SUMMARY"
