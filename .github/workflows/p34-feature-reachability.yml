name: p34 Feature Reachability

on:
  push:
    branches:
      - test/zonoemenu-v1-p34-cleanup-audit
    paths:
      - '.github/workflows/p34-feature-reachability.yml'

permissions:
  contents: read

jobs:
  reachability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/zonoemenu-v1-p34-cleanup-audit
          fetch-depth: 0

      - name: Run corrected repository audit
        run: |
          set -euxo pipefail
          git -c core.quotepath=false status --short
          python3 scripts/p34_repository_audit.py | tee p34-audit.log
          cat p34-audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run corrected grouped reachability audit
        run: |
          set -euxo pipefail
          python3 scripts/p34_feature_reachability.py | tee p34-feature-reachability.log
          cat p34-feature-reachability.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload corrected audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: p34-corrected-audit
          path: |
            p34-audit-report.md
            p34-audit-report.json
            p34-audit.log
            p34-feature-reachability.log
          if-no-files-found: error
